profile: workload-isolated
server:
  grpc:
    network: tcp
    addr: 127.0.0.1:19090
    timeout: 1s
    tls:
      certificate_file: /run/secrets/ani-iam-grpc.crt
      private_key_file: /run/secrets/ani-iam-grpc.key
      client_ca_file: /run/secrets/ani-iam-gateway-client-ca.crt
      gateway_client_dns_name: ani-gateway
  admin:
    network: tcp
    addr: 127.0.0.1:19091
    timeout: 1s
  shutdown_timeout: 5s
runtime:
  workload_registry_file: /etc/ani-iam/workload-targets.v1.json
  workload_registry_sha256: d3716c9d834f013d9b8ca554bd4f169e82ea6a041905acd508ad5d35c3fb920b
  environment: wr17-18-isolated
  trust_domain: iam.wr17-18.test
  postgresql:
    dsn: postgresql://ani_iam_runtime@127.0.0.1:5432/ani_iam?sslmode=disable
  redis:
    addr: 127.0.0.1:6379
    database: 0
    namespace: ani-iam:dp2-05
    login_limit: 5
    login_window: 900s
    dial_timeout: 0.5s
    read_timeout: 0.5s
    write_timeout: 0.5s
  access_token:
    issuer: ani-iam
    active_key_id: dp2-05-ed25519-1
    private_key_file: /run/secrets/ani-iam-access-token-ed25519.pem
  notification:
    address: 127.0.0.1:29090
    certificate_file: /run/secrets/ani-iam-notification-client.crt
    private_key_file: /run/secrets/ani-iam-notification-client.key
    server_ca_file: /run/secrets/ani-notification-server-ca.crt
    server_dns_name: notification.iam.wr17-18.test
    client_dns_name: ani-iam.iam.wr17-18.test
    outbox_key_file: /run/secrets/ani-iam-notification-outbox-keys.json
    console_action_url_base: https://console.example.test/password-action
    tenant_invitation_url_base: https://console.example.test/invitation
    platform_invitation_url_base: https://boss.example.test/invitation
    locale: en-US
    dispatch_interval: 0.25s
    submission_timeout: 5s
  oidc:
    provider: dex
    issuer_url: https://dex.example.test/dex
    client_id: ani-console
    client_secret_file: /run/secrets/ani-iam-dex-client-secret
    login_redirect_uri: https://console.example.test/auth/oidc/callback
    identity_link_redirect_uri: https://console.example.test/auth/oidc/link/callback
    recent_reauthentication: 600s
    http_timeout: 5s
  policy_revision: "sha256:3aa23e4e6197ce62c6e9d28d567f2ee6ccdcf14703b43b40bf3692491877a2b7"
