syntax = "proto3";
package reference.v1;
option go_package = "github.com/zhangzhe-ctrl/ani-iam/examples/workload-grpc/api/reference/v1;referencev1";

// Minimal read-only owner; registration and identity remain deployment inputs.
service InventoryService {
  rpc ReadStatus(ReadStatusRequest) returns (ReadStatusResponse);
  rpc ReadResource(ReadResourceRequest) returns (ReadResourceResponse);
}
message ReadStatusRequest {}
message ReadStatusResponse { string status = 1; }
message ReadResourceRequest {
  string tenant_id = 1;
  string subject_id = 2;
  string resource_id = 3;
  string request_id = 4;
}
message ReadResourceResponse { string resource_id = 1; string status = 2; }
