version: v2
plugins:
  - local: protoc-gen-go
    out: ../../..
    opt:
      - module=github.com/zhangzhe-ctrl/ani-iam
      - Mauth/v1/auth_service.proto=github.com/zhangzhe-ctrl/ani-iam/internal/compat/authv1;authv1
      - Mcommon/v1/common.proto=github.com/zhangzhe-ctrl/ani-iam/internal/compat/authv1/commonv1;commonv1
  - local: protoc-gen-go-grpc
    out: ../../..
    opt:
      - module=github.com/zhangzhe-ctrl/ani-iam
      - Mauth/v1/auth_service.proto=github.com/zhangzhe-ctrl/ani-iam/internal/compat/authv1;authv1
      - Mcommon/v1/common.proto=github.com/zhangzhe-ctrl/ani-iam/internal/compat/authv1/commonv1;commonv1
