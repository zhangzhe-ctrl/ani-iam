syntax = "proto3";

package ani.iam.conf;

option go_package = "github.com/zhangzhe-ctrl/ani-iam/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  string profile = 1;
  Server server = 2;
  Runtime runtime = 3;
}

message Server {
  message GRPC {
    message TLS {
      string certificate_file = 1;
      string private_key_file = 2;
      string client_ca_file = 3;
      string gateway_client_dns_name = 4;
    }

    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
    TLS tls = 4;
  }

  message Admin {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }

  GRPC grpc = 1;
  Admin admin = 2;
  google.protobuf.Duration shutdown_timeout = 3;
}

message Runtime {
  PostgreSQL postgresql = 1;
  Redis redis = 2;
  AccessToken access_token = 3;
  string policy_revision = 4;
  Notification notification = 5;
  OIDC oidc = 6;
  string environment = 7;
  string trust_domain = 8;
}

message PostgreSQL {
  string dsn = 1;
}

message Redis {
  string addr = 1;
  string username = 2;
  string password = 3;
  int32 database = 4;
  string namespace = 5;
  uint32 login_limit = 6;
  google.protobuf.Duration login_window = 7;
  google.protobuf.Duration dial_timeout = 8;
  google.protobuf.Duration read_timeout = 9;
  google.protobuf.Duration write_timeout = 10;
}

message AccessToken {
  string issuer = 1;
  string active_key_id = 2;
  string private_key_file = 3;
}

message Notification {
  string address = 1;
  string certificate_file = 2;
  string private_key_file = 3;
  string server_ca_file = 4;
  string server_dns_name = 5;
  string console_action_url_base = 6;
  string locale = 7;
  google.protobuf.Duration dispatch_interval = 8;
  google.protobuf.Duration submission_timeout = 9;
}

message OIDC {
  string provider = 1;
  string issuer_url = 2;
  string client_id = 3;
  string client_secret_file = 4;
  string login_redirect_uri = 5;
  string identity_link_redirect_uri = 6;
  google.protobuf.Duration recent_reauthentication = 7;
  google.protobuf.Duration http_timeout = 8;
}
