syntax = "proto3";

package iam.v1;

import "contract.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/zhangzhe-ctrl/ani-iam/api/iam/v1;iamv1";

// IAMAdminService owns IAM administration. It never owns or mutates Core Tenant Lifecycle.
service IAMAdminService {
  rpc ListCoreDLQEntries(ListCoreDLQEntriesRequest) returns (ListCoreDLQEntriesResponse);
  rpc GetCoreDLQEntry(GetCoreDLQEntryRequest) returns (GetCoreDLQEntryResponse);
  rpc ReplayCoreDLQEntry(ReplayCoreDLQEntryRequest) returns (ReplayCoreDLQEntryResponse);
  rpc GetTenantBootstrap(GetTenantBootstrapRequest) returns (GetTenantBootstrapResponse);
  rpc ReissueTenantBootstrapInvitation(ReissueTenantBootstrapInvitationRequest) returns (ReissueTenantBootstrapInvitationResponse);
  rpc RetryTenantBootstrapJob(RetryTenantBootstrapJobRequest) returns (RetryTenantBootstrapJobResponse);
  rpc AcceptPlatformInvitation(AcceptPlatformInvitationRequest) returns (AcceptPlatformInvitationResponse);
  rpc AcceptTenantInvitation(AcceptTenantInvitationRequest) returns (AcceptTenantInvitationResponse);
  rpc ApproveRecoveryBootstrap(ApproveRecoveryBootstrapRequest) returns (ApproveRecoveryBootstrapResponse);
  rpc ApproveRestoreTenantAdmin(ApproveRestoreTenantAdminRequest) returns (ApproveRestoreTenantAdminResponse);
  rpc BindPlatformRole(BindPlatformRoleRequest) returns (BindPlatformRoleResponse);
  rpc BindTenantRole(BindTenantRoleRequest) returns (BindTenantRoleResponse);
  rpc CancelPlatformInvitation(CancelPlatformInvitationRequest) returns (CancelPlatformInvitationResponse);
  rpc CancelTenantInvitation(CancelTenantInvitationRequest) returns (CancelTenantInvitationResponse);
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc CreatePlatformInvitation(CreatePlatformInvitationRequest) returns (CreatePlatformInvitationResponse);
  rpc CreatePlatformRole(CreatePlatformRoleRequest) returns (CreatePlatformRoleResponse);
  rpc CreateTenantWorkload(CreateTenantWorkloadRequest) returns (CreateTenantWorkloadResponse);
  rpc CreateTenantInvitation(CreateTenantInvitationRequest) returns (CreateTenantInvitationResponse);
  rpc CreateTenantRole(CreateTenantRoleRequest) returns (CreateTenantRoleResponse);
  rpc DeletePlatformRole(DeletePlatformRoleRequest) returns (DeletePlatformRoleResponse);
  rpc DeleteTenantRole(DeleteTenantRoleRequest) returns (DeleteTenantRoleResponse);
  rpc ExecuteRecoveryBootstrap(ExecuteRecoveryBootstrapRequest) returns (ExecuteRecoveryBootstrapResponse);
  rpc ExecuteRestoreTenantAdmin(ExecuteRestoreTenantAdminRequest) returns (ExecuteRestoreTenantAdminResponse);
  rpc GetAuditEvent(GetAuditEventRequest) returns (GetAuditEventResponse);
  rpc GetPlatformAuditEvent(GetPlatformAuditEventRequest) returns (GetPlatformAuditEventResponse);
  rpc GetPlatformInvitation(GetPlatformInvitationRequest) returns (GetPlatformInvitationResponse);
  rpc GetPlatformMembership(GetPlatformMembershipRequest) returns (GetPlatformMembershipResponse);
  rpc GetPlatformRole(GetPlatformRoleRequest) returns (GetPlatformRoleResponse);
  rpc GetTenantWorkload(GetTenantWorkloadRequest) returns (GetTenantWorkloadResponse);
  rpc GetTenantAccess(GetTenantAccessRequest) returns (GetTenantAccessResponse);
  rpc GetTenantInvitation(GetTenantInvitationRequest) returns (GetTenantInvitationResponse);
  rpc GetTenantMembership(GetTenantMembershipRequest) returns (GetTenantMembershipResponse);
  rpc GetTenantRole(GetTenantRoleRequest) returns (GetTenantRoleResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  rpc ListPlatformAuditEvents(ListPlatformAuditEventsRequest) returns (ListPlatformAuditEventsResponse);
  rpc ListPlatformInvitations(ListPlatformInvitationsRequest) returns (ListPlatformInvitationsResponse);
  rpc ListPlatformMemberships(ListPlatformMembershipsRequest) returns (ListPlatformMembershipsResponse);
  rpc ListPlatformRoles(ListPlatformRolesRequest) returns (ListPlatformRolesResponse);
  rpc ListPlatformPermissions(ListPlatformPermissionsRequest) returns (PermissionCatalogResponse);
  rpc ListTenantWorkloads(ListTenantWorkloadsRequest) returns (ListTenantWorkloadsResponse);
  rpc ListTenantInvitations(ListTenantInvitationsRequest) returns (ListTenantInvitationsResponse);
  rpc ListTenantMemberships(ListTenantMembershipsRequest) returns (ListTenantMembershipsResponse);
  rpc ListTenantRoles(ListTenantRolesRequest) returns (ListTenantRolesResponse);
  rpc ListTenantPermissions(ListTenantPermissionsRequest) returns (PermissionCatalogResponse);
  rpc RemovePlatformMembership(RemovePlatformMembershipRequest) returns (RemovePlatformMembershipResponse);
  rpc RemoveTenantMembership(RemoveTenantMembershipRequest) returns (RemoveTenantMembershipResponse);
  rpc RequestRecoveryBootstrap(RequestRecoveryBootstrapRequest) returns (RequestRecoveryBootstrapResponse);
  rpc RequestRestoreTenantAdmin(RequestRestoreTenantAdminRequest) returns (RequestRestoreTenantAdminResponse);
  rpc ResendPlatformInvitation(ResendPlatformInvitationRequest) returns (ResendPlatformInvitationResponse);
  rpc ResendTenantInvitation(ResendTenantInvitationRequest) returns (ResendTenantInvitationResponse);
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse);
  rpc UnbindPlatformRole(UnbindPlatformRoleRequest) returns (UnbindPlatformRoleResponse);
  rpc UnbindTenantRole(UnbindTenantRoleRequest) returns (UnbindTenantRoleResponse);
  rpc UpdatePlatformMembership(UpdatePlatformMembershipRequest) returns (UpdatePlatformMembershipResponse);
  rpc UpdatePlatformRole(UpdatePlatformRoleRequest) returns (UpdatePlatformRoleResponse);
  rpc UpdateTenantWorkload(UpdateTenantWorkloadRequest) returns (UpdateTenantWorkloadResponse);
  rpc UpdateTenantAccess(UpdateTenantAccessRequest) returns (UpdateTenantAccessResponse);
  rpc UpdateTenantMembership(UpdateTenantMembershipRequest) returns (UpdateTenantMembershipResponse);
  rpc UpdateTenantRole(UpdateTenantRoleRequest) returns (UpdateTenantRoleResponse);
}

// Catalog values are generated from owner contracts, never caller-defined.
message PermissionCatalogResponse {
  repeated string permissions = 1;
  string next_cursor = 2;
  string policy_revision = 3;
}

message ListTenantPermissionsRequest {
  BearerCredential credential = 1;
  string tenant_id = 2;
  CursorPageRequest page = 3;
}

message ListPlatformPermissionsRequest {
  BearerCredential credential = 1;
  CursorPageRequest page = 2;
}

// RecoveryOperationStatus is the explicit lifecycle for dual-control recovery.
enum RecoveryOperationStatus {
  RECOVERY_OPERATION_STATUS_UNSPECIFIED = 0;
  RECOVERY_OPERATION_STATUS_PENDING_APPROVAL = 1;
  RECOVERY_OPERATION_STATUS_APPROVED = 2;
  RECOVERY_OPERATION_STATUS_EXECUTED = 3;
  RECOVERY_OPERATION_STATUS_EXPIRED = 4;
  RECOVERY_OPERATION_STATUS_REJECTED = 5;
}

// TenantAccess is IAM-owned and distinct from Core-owned Tenant Lifecycle.
message TenantAccess {
  string tenant_id = 1;
  TenantAccessStatus status = 2;
  uint64 version = 3;
}

// Membership is an established relation. A pending Invitation is not a Membership.
message Membership {
  string membership_id = 1;
  string principal_id = 2;
  PrincipalType principal_type = 3;
  Boundary boundary = 4;
  MembershipStatus status = 5;
  repeated string role_ids = 6;
  uint64 version = 7;
}

// Role contains only catalogued permissions for exactly one boundary.
message Role {
  string role_id = 1;
  Boundary boundary = 2;
  string code = 3;
  string display_name = 4;
  bool system = 5;
  uint64 system_definition_version = 6;
  repeated string permissions = 7;
  uint64 version = 8;
}

// Invitation is a time-bound intent and contains no active authority.
message Invitation {
  string invitation_id = 1;
  Boundary boundary = 2;
  string normalized_email_hint = 3;
  repeated string role_ids = 4;
  InvitationStatus status = 5;
  google.protobuf.Timestamp expires_at = 6;
  uint64 version = 7;
  string bootstrap_operation_id = 8;
  uint64 delivery_generation = 9;
  string delivery_status = 10;
  uint32 delivery_attempt_count = 11;
}

// TenantWorkload is fixed to one Core-owned Tenant ID.
message TenantWorkload {
  string principal_id = 1;
  string tenant_id = 2;
  string name = 3;
  PrincipalStatus status = 4;
  string membership_id = 5;
  uint64 version = 6;
}

// APIKey describes a credential without its one-time secret.
message APIKey {
  string key_id = 1;
  string principal_id = 2;
  APIKeyStatus status = 3;
  string display_prefix = 4;
  bool never_expires = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_used_at = 8;
}

// AuditBoundary describes an event context and is never an authorization grant.
message AuditBoundary {
  oneof boundary {
    TenantBoundary tenant = 1;
    PlatformBoundary platform = 2;
    PrincipalAuditBoundary principal = 3;
  }
}
message PrincipalAuditBoundary {}

// AuditEvent is an allowlisted, append-only IAM security fact.
message AuditEvent {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string actor_principal_id = 3;
  repeated AuthnMethod authn_methods = 4;
  AuditBoundary boundary = 5;
  string action = 6;
  string target_type = 7;
  string target_id = 8;
  string result = 9;
  string reason = 10;
  string request_id = 11;
  string correlation_id = 12;
  string decision_id = 13;
  uint64 target_version = 14;
  map<string, string> details = 15;
  google.protobuf.Timestamp recorded_at = 16;
  string source_service = 17;
  string actor_type = 18;
  string authentication_method = 19;
  string caller_principal_id = 20;
  string caller_binding_id = 21;
  uint64 caller_binding_version = 22;
  uint64 caller_grant_version = 23;
}

// RecoveryOperation records a dual-control request bound to an immutable payload hash.
message RecoveryOperation {
  string operation_id = 1;
  string tenant_id = 2;
  string intended_principal_id = 3;
  string requester_principal_id = 4;
  string approver_principal_id = 5;
  string approval_reference = 6;
  string reason = 7;
  string payload_fingerprint = 8;
  RecoveryOperationStatus status = 9;
  google.protobuf.Timestamp approval_expires_at = 10;
  uint64 version = 11;
}

