// Metadata of the original Core-requested IAM operation. Invitation secrets,
// raw source payloads and membership creation are excluded from these responses.
message TenantBootstrapJob {
  string kind = 1;
  uint64 generation = 2;
  string state = 3;
  uint32 attempt_count = 4;
  uint32 cycle_start_attempt = 5;
  string last_error = 6;
  google.protobuf.Timestamp available_at = 7;
  string recovery_id = 8;
}
message TenantBootstrapOperation {
  string operation_id = 1;
  string tenant_id = 2;
  string status = 3;
  uint64 version = 4;
  Invitation invitation = 5;
  repeated TenantBootstrapJob jobs = 6;
}
message GetTenantBootstrapRequest {
  BearerCredential credential = 1;
  string operation_id = 2;
}
message GetTenantBootstrapResponse { TenantBootstrapOperation operation = 1; }
// Retains the stored intended identity, roles, Invitation ID and original
// Bootstrap operation. Current Platform and source execution authority apply.
message ReissueTenantBootstrapInvitationRequest {
  BearerCredential credential = 1;
  string operation_id = 2;
  uint64 expected_version = 3;
  string reason_code = 4;
  string idempotency_key = 5;
}
message ReissueTenantBootstrapInvitationResponse { TenantBootstrapOperation operation = 1; }

// Technical retry retains the original business operation and intended identity.
// Current Platform/source authority is mandatory even for cached receipts.
message RetryTenantBootstrapJobRequest {
  BearerCredential credential = 1;
  string operation_id = 2;
  string kind = 3;
  uint64 generation = 4;
  uint32 expected_attempt = 5;
  uint64 expected_version = 6;
  string reason_code = 7;
  string idempotency_key = 8;
}
message RetryTenantBootstrapJobResponse { TenantBootstrapOperation operation = 1; }

// Immutable quarantine metadata; raw payload and headers require Get.
message CoreDLQEntry {
  string entry_id = 1;
  string consumer_id = 2;
  string broker_name = 3;
  string account = 4;
  string stream = 5;
  string subject = 6;
  int64 broker_sequence = 7;
  uint64 delivery_count = 8;
  google.protobuf.Timestamp published_at = 9;
  google.protobuf.Timestamp quarantined_at = 10;
  string raw_sha256 = 11;
  string last_error = 12;
  uint64 last_attempt = 13;
  bool provenance_available = 14;
}
message CoreDLQHeader { string name = 1; repeated string values = 2; }
message CoreDLQAttempt {
  string attempt_id = 1;
  string audit_id = 2;
  uint64 attempt_number = 3;
  string outcome = 4;
  string projection_outcome = 5;
  string error_code = 6;
  string reason_code = 7;
  string authority_sha256 = 8;
  google.protobuf.Timestamp created_at = 9;
}
message ListCoreDLQEntriesRequest {
  BearerCredential credential = 1;
  string consumer_id = 2;
  CursorPageRequest page = 3;
}
message ListCoreDLQEntriesResponse { repeated CoreDLQEntry entries = 1; string next_cursor = 2; }
message GetCoreDLQEntryRequest {
  BearerCredential credential = 1;
  string consumer_id = 2;
  string entry_id = 3;
  CursorPageRequest page = 4;
}
message GetCoreDLQEntryResponse {
  CoreDLQEntry entry = 1;
  bytes raw_payload = 2;
  repeated CoreDLQHeader headers = 3;
  repeated CoreDLQAttempt attempts = 4;
  string next_cursor = 5;
}
// Re-receives the stored original synchronously. No request field can replace
// payload, headers, identity, source coordinates, Tenant or event time.
message ReplayCoreDLQEntryRequest {
  BearerCredential credential = 1;
  string consumer_id = 2;
  string entry_id = 3;
  string expected_raw_sha256 = 4;
  uint64 expected_attempt = 5;
  string reason_code = 6;
  string idempotency_key = 7;
}
// A committed receiver result. Bootstrap operation completion remains separate.
message ReplayCoreDLQEntryResponse {
  string consumer_id = 1;
  string entry_id = 2;
  string attempt_id = 3;
  string audit_id = 4;
  uint64 attempt_number = 5;
  string raw_sha256 = 6;
  string outcome = 7;
  string projection_outcome = 8;
  string authority_sha256 = 9;
  string event_id = 10;
  string tenant_id = 11;
  string operation_id = 12;
  int64 source_sequence = 13;
  bool replayed = 14;
}
