version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "internal/data/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/data/sqlcgen"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        query_parameter_limit: 0
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
