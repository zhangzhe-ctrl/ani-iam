apiVersion: apps/v1
kind: Deployment
metadata:
  name: cf01-echo
  namespace: ani-cutover-current
  labels:
    cutover-fitness-id: CF-01
    run-id: 20260908t105253z
spec:
  replicas: 1
  selector:
    matchLabels: {app: cf01-echo, run-id: 20260908t105253z}
  template:
    metadata:
      labels:
        app: cf01-echo
        cutover-fitness-id: CF-01
        run-id: 20260908t105253z
    spec:
      containers:
        - name: probe
          image: docker.changqingyun.cn/ani/cf01-probe@sha256:427e694db951cb2f20c071515f59009e47ef188c5bfd30a837094f780ae6cf88
          imagePullPolicy: Always
          args: ["serve", "--tcp-port", "18080", "--udp-port", "18081"]
          ports:
            - {name: tcp, containerPort: 18080, protocol: TCP}
            - {name: udp, containerPort: 18081, protocol: UDP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: cf01-echo
  namespace: ani-cutover-current
  labels:
    cutover-fitness-id: CF-01
    run-id: 20260908t105253z
spec:
  type: ClusterIP
  selector: {app: cf01-echo, run-id: 20260908t105253z}
  ports:
    - {name: tcp, port: 18080, targetPort: tcp, protocol: TCP}
    - {name: udp, port: 18081, targetPort: udp, protocol: UDP}
---
apiVersion: v1
